name: CI

on:
  pull_request:
  push:
    branches-ignore: [gh-pages]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend tests
        run: npm test -w backend
      - name: Build backend and UI
        run: npm run build
